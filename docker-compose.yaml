services:
  api-dev:
    hostname: api-dev
    container_name: takehome-api-dev
    build:
      dockerfile: api-dev.Dockerfile
      context: ./docker
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # Debug módban a 500-as hibaválasz a stack trace-t is tartalmazza.
      APP_DEBUG: "true"
    volumes:
      - ./api:/var/www/html
    extra_hosts:
      # XDebug csatlakozás miatt kell. Windows alatt, WSL-ből indítva nem
      # fogsz tudni rácsatlakozni Windows oldalról. Ha így akarod használni,
      # ezt a sort módosítani kell.
      - host.docker.internal:host-gateway
    networks:
      ads_takehome:
    ports:
      - 8080:80
    # Az alap image (trafex/php-nginx) healthcheckje a 8080-as portot hívja,
    # de ebben a konténerben az nginx a 80-ason figyel, így mindig
    # „unhealthy” lenne. Helyette egy valódi végpontot kérdezünk le: ha
    # válaszol, a PHP és az adatbázis-kapcsolat is működik.
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "--output", "/dev/null", "http://127.0.0.1/regions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  client-dev:
    hostname: client-dev
    container_name: takehome-client-dev
    build:
      dockerfile: client-dev.Dockerfile
      context: ./docker
    environment:
      # Itt a host gép címére hivatkozunk, mert a böngészőt (jó eséllyel) azon
      # futtatjuk.
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./client:/usr/src/client
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      ads_takehome:
    ports:
      - 5173:5173

  prod:
    hostname: prod
    container_name: takehome-prod
    build:
      dockerfile: docker/prod.Dockerfile
      context: .
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      ads_takehome:
    ports:
      - 8300:8000
    # Mint az api-dev-nél: a belső API szerver a 8001-es porton figyel.
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "--output", "/dev/null", "http://127.0.0.1:8001/regions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # A prod csak a kész (importált) adatbázissal induljon.
    depends_on:
      db:
        condition: service_healthy

  db:
    hostname: db
    container_name: takehome-db
    image: mysql:8.0.36
    command: |
      mysqld 
      --character_set_server=utf8mb4
      --collation_server=utf8mb4_hungarian_ci
      --local-infile=1
    environment:
      TZ: Europe/Budapest
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ${MYSQL_DATA_DIR}:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      ads_takehome:
    ports:
      - 8081:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 30s
      retries: 10
      # Az első indításkor a CSV-k importja ~45 s (lassabb gépen több), ezalatt
      # a healthcheck még nem sikerülhet. A türelmi időben a hibák nem
      # számítanak, a konténer viszont az első sikeres ellenőrzéskor rögtön
      # „healthy” lesz, így a további indításokat ez nem lassítja.
      start_period: 300s

  # TODO: dist

networks:
  ads_takehome:
